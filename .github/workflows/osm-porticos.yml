name: Pórticos desde OpenStreetMap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar pórticos, peajes y autopistas de la RM (Overpass)
        run: |
          Q='[out:json][timeout:180];
          (
            node["highway"="toll_gantry"](-34.2,-71.8,-32.9,-70.2);
            node["barrier"="toll_booth"](-34.2,-71.8,-32.9,-70.2);
            way["highway"~"^(motorway|motorway_link|trunk|trunk_link)$"](-33.80,-71.0,-33.15,-70.40);
          );
          out body geom;'
          mkdir -p osm
          UA="tagme-datos/1.0 (+https://github.com/2010CR7/tagme-datos)"
          for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sSf -m 240 -A "$UA" -H "Accept: application/json" --data-urlencode "data=$Q" "$url" -o osm/rm_raw.json && break
            sleep 20
          done
          python3 -c "import json;d=json.load(open('osm/rm_raw.json'));print(len(d['elements']))"
      - name: Guardar en la rama osm
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B osm
          git add -f osm/rm_raw.json
          git commit -m "Datos OSM de pórticos (© colaboradores de OpenStreetMap, ODbL)"
          git push -f origin osm
